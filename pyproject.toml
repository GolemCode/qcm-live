[project]
name = "qcm-live"
version = "0.1.0"
description = "QCM d'évaluation en direct : questions au tableau, réponses sur téléphone."
requires-python = ">=3.12"
dependencies = [
    "django>=6.0,<6.2",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

# Incrément en cours : toutes les exigences de SPEC.md marquées (I0)..(I<n>)
# doivent avoir au moins un test E2E passé (voir tests/spec_trace.py).
[tool.qcm]
increment = 2

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = [
    # Avertissement interne à pytest-base-url (dépendance de pytest-playwright), sans effet ici.
    "ignore:Session-scoped fixtures defined as instance methods:pytest.PytestRemovedIn10Warning",
]
markers = [
    "spec(id): rattache le test à une exigence de SPEC.md (ex. ETU-04)",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    ".claude/*",
    "scripts/*",
    "manage.py",
    "config/wsgi.py",
    "*/migrations/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "DJ", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# RUF012 signale à tort les attributs des classes Meta de Django (idiome standard).
"*/models.py" = ["RUF012"]
"*/forms.py" = ["RUF012"]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]
".claude/hooks/**" = ["S603", "S607"]

[tool.pyright]
include = ["config", "bank", "roster", "tests", ".claude/hooks", "scripts"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
