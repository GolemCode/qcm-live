{% extends "teacher/base.html" %}
{% block title %}Supprimer le groupe — QCM Live{% endblock %}
{% block content %}
  <h1>Supprimer le groupe ?</h1>
  <p>« {{ group.name }} » et ses {{ n_students }} étudiant{{ n_students|pluralize }}.</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button type="submit" class="danger">Supprimer</button>
    <a href="{% url 'group-detail' group.pk %}">Annuler</a>
  </form>
{% endblock %}
