{% extends "teacher/base.html" %}
{% block title %}Supprimer le QCM — QCM Live{% endblock %}
{% block content %}
  <h1>Supprimer le QCM ?</h1>
  <p>« {{ quiz.title }} ». Ses questions restent dans la banque.</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button type="submit" class="danger">Supprimer</button>
    <a href="{% url 'quiz-detail' quiz.pk %}">Annuler</a>
  </form>
{% endblock %}
