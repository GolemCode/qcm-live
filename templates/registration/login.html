{% extends "base.html" %}
{% block title %}Connexion enseignant — QCM Live{% endblock %}
{% block content %}
  <h1>Connexion enseignant</h1>
  <form method="post" action="{% url 'login' %}" class="form">
    {% csrf_token %}
    {% if form.non_field_errors %}
      <div class="error" role="alert">{{ form.non_field_errors|join:" " }}</div>
    {% endif %}
    <label for="{{ form.username.id_for_label }}">Identifiant</label>
    {{ form.username }}
    <label for="{{ form.password.id_for_label }}">Mot de passe</label>
    {{ form.password }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Se connecter</button>
  </form>
{% endblock %}
