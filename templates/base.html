{% load static %}<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}QCM Live{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <main class="page"{% block main_attrs %}{% endblock %}>
    {% block header %}{% endblock %}
    {% if messages %}
      <div class="messages" role="status">{% for message in messages %}<p>{{ message }}</p>{% endfor %}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
